[project]
name = "google-chat-bot"
version = "0.1.11"
description = "Google Chat integration for AI Agents"
authors = [{ name = "Taoufiq" }]
requires-python = ">=3.14"
dependencies = [
    # [postgres] provides the psycopg2 + asyncpg drivers for PostgreSQL-backed
    # sessions. No DATABASE_URL → in-memory.
    "orrery-core[postgres]",
    "orrery-assistant",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "google-auth>=2.55.0",
    "google-cloud-pubsub>=2.39.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
]

[tool.uv.sources]
orrery-core = { workspace = true }
orrery-assistant = { workspace = true }

[tool.setuptools.packages.find]
include = ["google_chat_bot*"]
