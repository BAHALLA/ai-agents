[project]
name = "slack-bot"
version = "0.2.2"
description = "Slack bot integration for the DevOps agent platform"
requires-python = ">=3.14"
dependencies = [
    # [postgres] provides the psycopg2 + asyncpg drivers for PostgreSQL-backed
    # sessions. No DATABASE_URL / SLACK_DB_URL → in-memory.
    "orrery-core[postgres]",
    "orrery-assistant",
    "slack-bolt>=1.29.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "aiohttp>=3.14.1",
    "slowapi>=0.1.10",
]

[tool.uv.sources]
orrery-core = { workspace = true }
orrery-assistant = { workspace = true }

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slack_bot*"]
