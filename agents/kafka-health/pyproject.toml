[project]
name = "kafka-health-agent"
version = "0.2.0"
description = "Agent for monitoring and managing Kafka cluster health"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
    "confluent-kafka>=2.14.2",
    "kubernetes>=36.0.2",
]

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kafka_health_agent*"]
