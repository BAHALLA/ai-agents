[project]
name = "orrery"
version = "0.1.11"
description = "A collection of autonomous AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
    "docker-agent",
    "elasticsearch-agent",
    "kafka-health-agent",
    "k8s-health-agent",
    "observability-agent",
    "orrery-assistant",
    "ops-journal",
    "slack-bot",
    "google-chat-bot",
    "google-adk>=2.2.0",
    "litellm>=1.85.4",
]

[project.optional-dependencies]
# Propagate postgres extra from orrery-core to the workspace root.
# Install with: uv sync --extra postgres
postgres = [
    "orrery-core[postgres]",
]
# Install with: uv sync --extra auth
auth = [
    "orrery-core[auth]",
]
# Install with: uv sync --extra server
server = [
    "orrery-core[server]",
]
# Install with: uv sync --extra otel
otel = [
    "orrery-core[otel]",
]

[tool.uv.sources]
orrery-core = { workspace = true }
docker-agent = { workspace = true }
elasticsearch-agent = { workspace = true }
kafka-health-agent = { workspace = true }
k8s-health-agent = { workspace = true }
observability-agent = { workspace = true }
orrery-assistant = { workspace = true }
ops-journal = { workspace = true }
slack-bot = { workspace = true }
google-chat-bot = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.155.7",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-gen-files>=0.6.1",
    "pymdown-extensions>=11.0",
]

[tool.uv.workspace]
members = ["core", "agents/*"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
# google-adk[eval] -> google-cloud-aiplatform[evaluation] hard-caps
# litellm at <1.86.0, which is incompatible with our litellm>=1.89.3 floor
# (no version pair satisfies both). aiplatform's cap is conservative — its
# evaluation path is only exercised by `make eval`. Override it so the
# workspace resolves; re-run `make eval` after litellm bumps to confirm the
# AgentEvaluator path still works.
override-dependencies = ["litellm>=1.89.3"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = [
    "orrery_core",
    "docker_agent",
    "elasticsearch_agent",
    "kafka_health_agent",
    "k8s_health_agent",
    "observability_agent",
    "orrery_assistant",
    "ops_journal_agent",
    "slack_bot",
]

[tool.pytest.ini_options]
markers = [
    "eval: agent evaluation tests that call a real LLM (deselected by default)",
]
# importlib import-mode lets duplicate test basenames (e.g. test_app.py /
# test_handler.py in both slack-bot and google-chat-bot) coexist without a
# rootdir/sys.path collision, so the whole workspace collects in one run.
addopts = "-m 'not eval' --import-mode=importlib"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] feature.* is enabled:UserWarning:google.adk.features.*",
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning:slowapi.extension",
    # Third-party deprecations we don't control (ADK internal agent-config base
    # class; Starlette TestClient's httpx shim used by fastapi.testclient).
    "ignore:BaseAgentConfig is deprecated.*:DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated.*",
]
testpaths = [
    "core/tests",
    "agents/docker-agent/tests",
    "agents/elasticsearch/tests",
    "agents/kafka-health/tests",
    "agents/k8s-health/tests",
    "agents/observability/tests",
    "agents/orrery-assistant/tests",
    "agents/ops-journal/tests",
    "agents/slack-bot/tests",
    "agents/google-chat-bot/tests",
]
