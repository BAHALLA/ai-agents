{{- if .Values.pubsubWorker.enabled -}}
{{- /*
  Safety guard: the in-memory idempotency backend is process-local, so it cannot
  deduplicate Pub/Sub redeliveries across replicas — a redelivered event on a
  second pod would double-run @destructive tools. Refuse to render a multi-replica
  worker (explicit replicaCount > 1, or autoscaling enabled) on backend "memory".
*/}}
{{- if eq .Values.pubsubWorker.idempotency.backend "memory" }}
{{- if or (gt (int .Values.pubsubWorker.replicaCount) 1) .Values.pubsubWorker.autoscaling.enabled }}
{{- fail "pubsubWorker.idempotency.backend=memory cannot run with more than one replica (replicaCount > 1 or autoscaling.enabled). Set idempotency.backend=postgres for multi-replica dedup." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orrery-assistant.pubsubWorker.fullname" . }}
  labels:
    {{- include "orrery-assistant.pubsubWorker.labels" . | nindent 4 }}
spec:
  {{- /* Omit replicas when the HPA owns it, else every upgrade resets scale and fights the HPA. */}}
  {{- if not .Values.pubsubWorker.autoscaling.enabled }}
  replicas: {{ .Values.pubsubWorker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "orrery-assistant.pubsubWorker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orrery-assistant.pubsubWorker.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and (not .Values.existingSecret) .Values.secrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.pubsubWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "orrery-assistant.pubsubWorker.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-pubsub-worker
          image: {{ include "orrery-assistant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.pubsubWorker.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "orrery-assistant.fullname" . }}
            - secretRef:
                name: {{ include "orrery-assistant.secretName" . }}
          env:
            # Idempotency guard (AEP-018). The postgres backend reuses DATABASE_URL
            # from the secret above; memory is single-replica only (guarded above).
            - name: GOOGLE_CHAT_PUBSUB_IDEMPOTENCY_BACKEND
              value: {{ .Values.pubsubWorker.idempotency.backend | quote }}
            - name: GOOGLE_CHAT_PUBSUB_IDEMPOTENCY_TTL_SECONDS
              value: {{ .Values.pubsubWorker.idempotency.ttlSeconds | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.pubsubWorker.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.pubsubWorker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pubsubWorker.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.pubsubWorker.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: {{ .Values.pubsubWorker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pubsubWorker.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.pubsubWorker.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.pubsubWorker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.pubsubWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pubsubWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pubsubWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
