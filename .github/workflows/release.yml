name: Release & Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    # Only gate releases here (tag pushes). Pushes to main are already covered
    # by ci.yml, so running this on every main commit would duplicate the gate.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      # Reuse the Makefile targets so the quality gate stays defined in one place
      # (matches ci.yml; ty search paths are derived from the workspace members).
      - name: Lint & type check
        run: make lint type-check

      - name: Test
        run: make test

  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=orrery-assistant
            org.opencontainers.image.description=AI-powered DevOps/SRE agent platform
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the images
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Image digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
    outputs:
      digest: ${{ steps.build.outputs.digest }}

  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint chart
        run: helm lint deploy/helm/orrery-assistant

      - name: Template chart (smoke test)
        run: helm template test deploy/helm/orrery-assistant > /tmp/rendered.yaml

      - name: Validate rendered manifests (kubeconform)
        env:
          KUBECONFORM_VERSION: v0.8.0
          # SHA256 of kubeconform-linux-amd64.tar.gz for the pinned version
          # (from the release CHECKSUMS). Bump both together on upgrade.
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          tarball=kubeconform.tar.gz
          curl -sL --fail -o "$tarball" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$tarball" kubeconform
          kubeconform -summary -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 /tmp/rendered.yaml

  release:
    name: GitHub Release
    needs: [ci, build-and-push, helm-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          version="${{ steps.version.outputs.version }}"
          # GHCR requires a lowercase repository path (the GitHub owner may be
          # mixed-case; docker/metadata-action lowercases it when tagging, so
          # the published image lives at the lowercase path). The image tags
          # carry the bare semver — metadata-action's `pattern={{version}}`
          # strips the tag's leading `v` — so reference `:X.Y.Z`, not `:vX.Y.Z`.
          IMAGE_URL="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

          # Extract this version's section from the changelog.
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          # Append Docker image info (body_path so it actually renders — the
          # previous inline "$(cat ...)" was never shell-evaluated by the action).
          {
            echo ""
            echo "## 🐳 Docker Images"
            echo ""
            echo "Available on GitHub Container Registry:"
            echo "- \`${IMAGE_URL}:${version}\`"
            echo "- \`${IMAGE_URL}:latest\`"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE_URL}:${version}"
            echo "\`\`\`"
            echo ""
            echo "### Multi-arch digest"
            echo "\`${DIGEST}\`"
          } >> release_notes.md

          # Asset file with the pinned digests.
          echo "${IMAGE_URL}:${version}@${DIGEST}" > docker-images.txt
          echo "${IMAGE_URL}:latest@${DIGEST}" >> docker-images.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            docker-images.txt
          draft: false
          prerelease: false
          generate_release_notes: false
