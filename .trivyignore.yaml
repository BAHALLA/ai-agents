# Triaged Trivy findings, with expiry dates.
#
# Every entry MUST carry `expired_at`. Trivy stops honouring an expired entry
# and the gate goes red again, which is the review mechanism — without it an
# ignore silently becomes permanent, and a permanent ignore is indistinguishable
# from not scanning.
#
# Wired explicitly via the `trivyignores` input in .github/workflows/ci.yml and
# release.yml: Trivy auto-loads a plain `.trivyignore` but NOT this YAML form,
# and only the YAML form supports expiry.
#
# Before adding an entry, exhaust the alternatives in order:
#   1. Upgrade the dependency (`uv lock --upgrade-package <name>`).
#   2. Re-pin the base/tool image to a rebuilt digest.
#   3. Remove the component if it is not actually needed.
# Only then triage, and say why in `statement` — a reader at 03:00 needs the
# reasoning, not the CVE id they already have.

vulnerabilities:
  # ── Go stdlib in the bundled Docker CLI ──────────────────────────────
  #
  # `usr/local/bin/docker` is copied from the digest-pinned `docker:29-cli`
  # image so the docker-agent's tools can inspect local containers. It is a Go
  # binary, and the Go standard library linked into it (v1.26.5) carries these
  # eight HIGH advisories.
  #
  # Why not fix it instead:
  #   - Upgrading does not help. Every published Docker CLI tag — 29-cli, cli,
  #     latest — is still built with Go 1.26.5 as of 2026-08-22. Upstream has
  #     not rebuilt against 1.26.6, so re-pinning to a newer digest changes
  #     nothing. (Verified by scanning each tag directly, not assumed.)
  #   - Removing the CLI would disable the docker-agent in-container.
  #   - Rebuilding the CLI ourselves from patched Go is disproportionate for a
  #     tool we invoke as a subprocess against a local socket.
  #
  # Why the residual risk is low: all eight are denial-of-service or
  # content-handling issues in a *client* binary that Orrery runs as a
  # subprocess against the local Docker socket. It serves no HTTP, renders no
  # templates to a browser, and parses no untrusted DNS. The worst realistic
  # outcome is the CLI subprocess crashing, which the tool layer already
  # handles as a tool error.
  #
  # Path scoping is deliberately absent: Trivy's `paths` filter does not match
  # gobinary findings (tried `usr/local/bin/docker`, `**/bin/docker`,
  # `usr/local/bin/*` — none apply). The practical scope is identical anyway,
  # because the Docker CLI is the only Go binary in the image; everything else
  # is Python.
  #
  # Expiry: 2026-10-21. Re-check whether a Docker CLI image built with Go
  # >= 1.26.6 exists; if it does, re-pin the digest in the Dockerfile and
  # delete this whole block.

  - id: CVE-2026-33818
    statement: "Go stdlib encoding/asn1 DoS in the bundled Docker CLI; no rebuilt upstream image exists."
    expired_at: 2026-10-21

